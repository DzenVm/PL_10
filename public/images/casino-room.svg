<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Abstrakcyjna ilustracja eleganckiego salonu gier z zielonym stołem">
  <defs>
    <radialGradient id="c-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="100%" stop-color="#050403"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f4d3d"/>
      <stop offset="60%" stop-color="#0a3a2e"/>
      <stop offset="100%" stop-color="#062720"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a2a"/>
      <stop offset="50%" stop-color="#e8cd85"/>
      <stop offset="100%" stop-color="#8a6a2a"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f4e3ad" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f4e3ad" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#c-bg)"/>
  <circle cx="800" cy="260" r="380" fill="url(#spot)"/>

  <ellipse cx="800" cy="700" rx="620" ry="220" fill="url(#table)"/>
  <ellipse cx="800" cy="700" rx="620" ry="220" fill="none" stroke="url(#rim)" stroke-width="10"/>
  <ellipse cx="800" cy="700" rx="540" ry="180" fill="none" stroke="#0d5a46" stroke-width="2" opacity="0.7"/>

  <g opacity="0.85">
    <circle cx="620" cy="640" r="16" fill="#e7e7e7"/>
    <circle cx="660" cy="650" r="16" fill="#c0392b"/>
    <circle cx="700" cy="640" r="16" fill="#1c1c1c"/>
    <circle cx="740" cy="650" r="16" fill="#e7e7e7"/>
    <circle cx="780" cy="638" r="16" fill="#c9a227"/>
  </g>

  <g stroke="url(#rim)" stroke-width="2" fill="none" opacity="0.7">
    <path d="M260 760 Q800 900 1340 760"/>
  </g>

  <g fill="url(#rim)" opacity="0.9">
    <circle cx="800" cy="150" r="4"/>
    <line x1="800" y1="154" x2="800" y2="220" stroke="url(#rim)" stroke-width="1.4"/>
    <circle cx="720" cy="180" r="2.6"/>
    <line x1="720" y1="182" x2="770" y2="230" stroke="url(#rim)" stroke-width="1.1"/>
    <circle cx="880" cy="180" r="2.6"/>
    <line x1="880" y1="182" x2="830" y2="230" stroke="url(#rim)" stroke-width="1.1"/>
  </g>

  <rect x="0" y="940" width="1600" height="60" fill="#040302"/>
</svg>
